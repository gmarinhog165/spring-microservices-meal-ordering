spring.application.name=bookingservice
server.port=8081

inventory.service.address=localhost
inventory.service.grpc.port=9090

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=booking-events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.datasource.url=jdbc:postgresql://localhost:5432/foodordering
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect