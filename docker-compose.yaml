## Stack local completo: infraestrutura + os seis microservices.
##
## Credenciais e tags vêm do .env (ver .env.example).
## Só o api-gateway e as UIs de infraestrutura publicam portas no host — os
## serviços a jusante não têm segurança própria e falam entre si pela rede
## interna, resolvendo-se pelo nome do serviço via DNS do Docker.

name: foodordering

services:

  # ---------------------------------------------------------------- infra ---

  postgres:
    image: postgres:18
    container_name: shop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [foodordering-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000
      # O `ruok` do healthcheck está fora da whitelist por omissão desde o ZooKeeper 3.5.
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [foodordering-net]

  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [foodordering-net]

  # kafka-ui e schema-registry sao ferramentas de inspecao, nao dependencias da
  # app. Ficam fora do `up` normal: `docker compose --profile tools up -d`.
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [tools]
    ports:
      - "8084:8080"
    depends_on:
      kafka-broker:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_NAME: local
      KAFKA_CLUSTERS_BOOTSTRAPSERVERS: kafka-broker:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks: [foodordering-net]

  kafka-schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: kafka-schema-registry
    container_name: kafka-schema-registry
    profiles: [tools]
    depends_on:
      kafka-broker:
        condition: service_healthy
    ports:
      - "8083:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: kafka-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka-broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://kafka-schema-registry:8081
    networks: [foodordering-net]

  keycloak-db:
    image: postgres:18
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - keycloak-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [foodordering-net]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # O emissor canónico é o URL interno: é o valor que fica na claim `iss`
      # dos tokens. auth-service emite e api-gateway valida contra o MESMO
      # URL, resolúvel dentro da rede — se divergirem, tudo dá 401.
      # O standard flow está desligado no realm (só direct access grant via
      # auth-service), por isso nenhum browser precisa de chegar ao emissor.
      KC_HOSTNAME_URL: http://keycloak:8080
      # A consola de administração continua acessível do host.
      KC_HOSTNAME_ADMIN_URL: http://localhost:8090
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Consumidos pelos placeholders ${...} do realm importado.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_FOOD_CLIENT_SECRET: ${KEYCLOAK_FOOD_CLIENT_SECRET}
    ports:
      - "8090:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/food-security-realm HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [foodordering-net]

  # ------------------------------------------------------------- serviços ---
  #
  # Sem `container_name` para que `docker compose up --scale <svc>=N` funcione.
  # `mem_limit` + MaxRAMPercentage sao o equivalente local aos
  # resources.requests/limits do k8s — ver docs/deployment.md.

  inventoryservice:
    build: ./inventoryservice
    image: ${REGISTRY:-foodordering}/inventoryservice:${TAG:-local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    networks: [foodordering-net]

  customerservice:
    build: ./customerservice
    image: ${REGISTRY:-foodordering}/customerservice:${TAG:-local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      # O Flyway do inventoryservice cria as tabelas de toda a gente.
      inventoryservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8079/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    networks: [foodordering-net]

  auth-service:
    build: ./auth-service
    image: ${REGISTRY:-foodordering}/auth-service:${TAG:-local}
    environment:
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/food-security-realm/protocol/openid-connect/token
      KEYCLOAK_ADMIN_USERS_URI: http://keycloak:8080/admin/realms/food-security-realm/users
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      CUSTOMER_SERVICE_URL: http://customerservice:8079/api/v1/customer
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      keycloak:
        condition: service_healthy
      customerservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    networks: [foodordering-net]

  bookingservice:
    build: ./bookingservice
    image: ${REGISTRY:-foodordering}/bookingservice:${TAG:-local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      INVENTORY_SERVICE_ADDRESS: inventoryservice
      INVENTORY_SERVICE_GRPC_PORT: "9090"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      inventoryservice:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    networks: [foodordering-net]

  orderservice:
    build: ./orderservice
    image: ${REGISTRY:-foodordering}/orderservice:${TAG:-local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      INVENTORY_SERVICE_ADDRESS: inventoryservice
      INVENTORY_SERVICE_GRPC_PORT: "9090"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      inventoryservice:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    networks: [foodordering-net]

  api-gateway:
    build: ./api-gateway
    image: ${REGISTRY:-foodordering}/api-gateway:${TAG:-local}
    # Unico serviço exposto no host: os restantes nao tem seguranca propria.
    ports:
      - "5000:5000"
    environment:
      # Tem de coincidir com a claim `iss` dos tokens emitidos pelo auth-service.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/food-security-realm
      SERVICES_AUTH_URL: http://auth-service:8086
      SERVICES_BOOKING_URL: http://bookingservice:8081
      SERVICES_INVENTORY_URL: http://inventoryservice:8080
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      keycloak:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      bookingservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    networks: [foodordering-net]

networks:
  foodordering-net:
    driver: bridge

volumes:
  postgres-data:
  keycloak-data:
  kafka-data: